[package]
name = "realtime-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web 框架：提供 HTTP 服务与 WebSocket 握手入口
actix-web = "4"
# WebSocket：handle() 一次完成握手，Session 写 / MessageStream 读
actix-ws = "0.3"
# 异步运行时与 broadcast 频道（广播）
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
# MessageStream 需要 StreamExt
futures-util = "0.3"
# JSON 协议
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# 测试用的 WebSocket 客户端（真实 TCP，不是 mock）
tokio-tungstenite = "0.24"
