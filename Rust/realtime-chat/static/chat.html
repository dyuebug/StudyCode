<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>realtime-chat</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: .5rem; align-items: center; padding: .75rem 1rem; border-bottom: 1px solid #8884; flex-wrap: wrap; }
  header input { padding: .4rem .6rem; font-size: 1rem; width: 10rem; }
  header button { padding: .4rem .9rem; font-size: 1rem; cursor: pointer; }
  #status { font-size: .85rem; opacity: .8; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; margin: 0; list-style: none; display: flex; flex-direction: column; gap: .35rem; }
  #log li { padding: .35rem .55rem; border-radius: .4rem; background: #8881; max-width: 80%; word-break: break-word; }
  #log li.sys { background: transparent; opacity: .7; font-size: .85rem; }
  #log li.me { align-self: flex-end; background: #4a90d922; }
  footer { display: flex; gap: .5rem; padding: .75rem 1rem; border-top: 1px solid #8884; }
  footer input { flex: 1; padding: .55rem .7rem; font-size: 1rem; }
  footer button { padding: .55rem 1.1rem; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<header>
  <label>房间 <input id="room" value="lobby" maxlength="32"></label>
  <button id="connect">连接</button>
  <span id="status">未连接</span>
</header>

<ul id="log"></ul>

<footer>
  <input id="text" placeholder="输入消息，回车发送（未连接时禁用）" disabled>
  <button id="send" disabled>发送</button>
</footer>

<script>
// ============================================
// 客户端只有三件事：连、收、发
// ============================================
//
// ⚠️ 本文件是"看得见的协议文档"：它消费的服务端消息类型
//    必须与 src/chat.rs / src/lib.rs 里的 json!({ "type": ... }) 一致：
//    join / leave / msg / error / lagged

const $room = document.getElementById('room');
const $status = document.getElementById('status');
const $log = document.getElementById('log');
const $text = document.getElementById('text');
const $send = document.getElementById('send');
const $connect = document.getElementById('connect');

let ws = null;
let myId = null;          // 由服务端 join 消息告知
let pollTimer = null;     // 成员数轮询

function addLine(text, cls) {
  const li = document.createElement('li');
  li.textContent = text;
  if (cls) li.className = cls;
  $log.appendChild(li);
  $log.scrollTop = $log.scrollHeight;
}

function setConnected(on) {
  $text.disabled = !on;
  $send.disabled = !on;
  $connect.textContent = on ? '断开' : '连接';
  $status.textContent = on ? '已连接' : '未连接';
  if (!on) { myId = null; stopPolling(); }
}

// 成员数用 HTTP 轮询，而不是让服务端推——
// 服务端的 join/leave 广播里有 count，但那个 count 是"事件发生那一刻"的，
// 断线重连、丢包之后可能与实际不一致。HTTP 查的是**当前真相**。
function startPolling(room) {
  stopPolling();
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`/rooms/${encodeURIComponent(room)}/members`);
      const body = await res.json();
      $status.textContent = `已连接（在线 ${body.data.count} 人）`;
    } catch (_) { /* 网络抖动时静默，下一轮会补上 */ }
  }, 2000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function connect() {
  const room = $room.value.trim();
  if (!room) { addLine('请先填房间名', 'sys'); return; }

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/${encodeURIComponent(room)}`);

  ws.onopen = () => { setConnected(true); startPolling(room); addLine(`已进入房间「${room}」`, 'sys'); };
  ws.onclose = (e) => { setConnected(false); addLine(`连接已关闭（code=${e.code}）`, 'sys'); };
  ws.onerror = () => addLine('连接出错', 'sys');

  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch (_) { addLine(`[原始] ${e.data}`, 'sys'); return; }

    switch (m.type) {
      case 'join':
        // 第一条 join 就是我自己（服务端先订阅再广播）
        if (myId === null) { myId = m.member; addLine(`我是 #${m.member}，房间共 ${m.count} 人`, 'sys'); }
        else addLine(`#${m.member} 加入，当前 ${m.count} 人`, 'sys');
        break;
      case 'leave':
        addLine(`#${m.member} 离开，当前 ${m.count} 人`, 'sys');
        break;
      case 'msg':
        addLine(`#${m.member}: ${m.text}`, m.member === myId ? 'me' : '');
        break;
      case 'error':
        addLine(`服务端拒绝：${m.message}`, 'sys');
        break;
      case 'lagged':
        addLine(`消息积压，已丢弃 ${m.missed} 条，请刷新重连`, 'sys');
        break;
      default:
        addLine(`[未知类型 ${m.type}] ${e.data}`, 'sys');
    }
  };
}

$connect.addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) { ws.close(); return; }
  connect();
});

function send() {
  const v = $text.value;
  if (!v || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(v);
  $text.value = '';
}

$send.addEventListener('click', send);
$text.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
