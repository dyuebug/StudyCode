[package]
name = "translate-cli-async"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }  # 去掉 "blocking"，默认就是异步
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }  # 新增：tokio 运行时
futures = "0.3"  # 新增：futures 工具库（提供 join_all）
