<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 - Rust HTTP 服务器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2.5em;
            margin: 0 0 20px 0;
        }
        h2 {
            font-size: 1.5em;
            margin: 20px 0 10px 0;
        }
        p, li {
            font-size: 1.1em;
            line-height: 1.6;
        }
        ul {
            padding-left: 20px;
        }
        .feature {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 关于这个项目</h1>

        <p>
            这是一个教学项目，展示如何用 Rust 从零开始构建 HTTP 服务器。
        </p>

        <h2>🎯 项目目标</h2>
        <ul>
            <li>理解 TCP/IP 网络编程</li>
            <li>深入理解 HTTP 协议</li>
            <li>实践 Rust 并发编程</li>
            <li>掌握文件 I/O 操作</li>
        </ul>

        <h2>✨ 已实现功能</h2>
        <div class="feature">
            <strong>✅ 阶段1：</strong> 基础 TCP 服务器
        </div>
        <div class="feature">
            <strong>✅ 阶段2：</strong> HTTP 协议处理和路由
        </div>
        <div class="feature">
            <strong>⏳ 阶段3：</strong> 静态文件服务（进行中）
        </div>
        <div class="feature">
            <strong>⏳ 阶段4：</strong> 多线程并发（计划中）
        </div>

        <h2>🛠️ 技术栈</h2>
        <p>
            <strong>语言：</strong> Rust<br>
            <strong>标准库：</strong> std::net, std::io, std::fs<br>
            <strong>特性：</strong> 零依赖，纯手写实现
        </p>

        <p style="margin-top: 30px;">
            <a href="/">← 返回首页</a>
        </p>
