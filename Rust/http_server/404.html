<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #434343 0%, #000000 100%);
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 6em;
            margin: 0;
            color: #ff6b6b;
        }
        h2 {
            font-size: 2em;
            margin: 20px 0;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            opacity: 0.8;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #ff6b6b;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: background 0.3s;
        }
        a:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>😕 页面未找到</h2>
        <p>
            抱歉，你访问的页面不存在。<br>
            可能是 URL 输入错误，或者页面已被删除。
        </p>
        <a href="/">返回首页</a>
    </div>
</body>
</html>
