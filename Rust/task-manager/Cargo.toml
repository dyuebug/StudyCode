[package]
name = "task-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web 框架
actix-web = "4"
# 异步运行时
tokio = { version = "1", features = ["full"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 数据库：单文件 SQLite + 编译期嵌入迁移
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

[dev-dependencies]
# 暂无需额外依赖：`app()` 把返回类型藏进了 `impl Trait`，
# 测试里不必指名 `actix_http::Request`。
# （有过一版曾在 `Cargo.toml` 里加 actix-http，修好 `app()` 的签名后就不再需要——
#   直接依赖只加"自己代码里真的写了名字"的 crate，否则只是延长编译时间。）
