# 学习论坛 Nginx 配置示例
# 使用前替换 forum.example.com 与证书路径。
# 部署位置：/etc/nginx/sites-available/forum.conf

limit_req_zone $binary_remote_addr zone=forum_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name forum.example.com;

    # Certbot 会自动改写为 301 跳转 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forum.example.com;

    ssl_certificate     /etc/letsencrypt/live/forum.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    access_log /var/log/nginx/forum.access.log;
    error_log  /var/log/nginx/forum.error.log;

    location /static/ {
        alias /opt/study-forum/forum_project/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        limit_req zone=forum_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
