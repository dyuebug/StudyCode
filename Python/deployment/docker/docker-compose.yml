services:
  forum:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    image: study-forum:1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      DATABASE: /data/forum.db
      PER_PAGE: "10"
    volumes:
      - forum-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/posts', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: false

volumes:
  forum-data:
