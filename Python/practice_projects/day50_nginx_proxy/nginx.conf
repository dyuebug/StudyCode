# 第 50 天练习：最小 Nginx 反向代理
#
# 与生产配置的差异：
# - 只监听 8080，不含 TLS；
# - 上游使用 compose 服务名 backend；
# - 限流阈值调低，便于观察 503。
#
# 语法检查：
#   docker compose -f practice_projects/day50_nginx_proxy/compose.yaml config
#   docker compose -f practice_projects/day50_nginx_proxy/compose.yaml run --rm nginx nginx -t

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    limit_req_zone $binary_remote_addr zone=practice_limit:10m rate=2r/s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    server {
        listen 8080;
        server_name _;

        location /static/ {
            # alias 末尾的斜杠必须保留。
            alias /srv/static/;
            expires 1h;
            add_header Cache-Control "public";
        }

        location / {
            limit_req zone=practice_limit burst=3 nodelay;

            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
    }
}
