services:
  backend:
    image: traefik/whoami:v1.10
    command: ["--port=8080"]
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/srv/static:ro
