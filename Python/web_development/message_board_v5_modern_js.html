<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 v5.0 - 现代JavaScript版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; }
        .message-card { margin-bottom: 15px; }
        .timestamp { color: #666; font-size: 0.9em; }
        .filter-section { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">💬 留言板 v5.0</h1>
        <p class="text-center text-muted">现代JavaScript版（ES6+ + 数组高级方法）</p>

        <!-- 筛选区域 -->
        <div class="filter-section card p-3">
            <h5>🔍 筛选功能</h5>
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">按姓名搜索：</label>
                    <input type="text" id="searchName" class="form-control" placeholder="输入姓名...">
                </div>
                <div class="col-md-6">
                    <label class="form-label">按内容搜索：</label>
                    <input type="text" id="searchContent" class="form-control" placeholder="输入内容关键词...">
                </div>
            </div>
            <div class="mt-3">
                <button class="btn btn-primary btn-sm" onclick="applyFilters()">应用筛选</button>
                <button class="btn btn-secondary btn-sm" onclick="resetFilters()">重置</button>
                <button class="btn btn-info btn-sm" onclick="sortByTime()">按时间排序</button>
            </div>
        </div>

        <!-- 添加留言表单 -->
        <div class="card p-4 mb-4">
            <h5>✍️ 发表留言</h5>
            <div class="mb-3">
                <label class="form-label">姓名：</label>
                <input type="text" id="nameInput" class="form-control" placeholder="请输入姓名">
            </div>
            <div class="mb-3">
                <label class="form-label">留言内容：</label>
                <textarea id="contentInput" class="form-control" rows="3" placeholder="请输入留言内容"></textarea>
            </div>
            <button class="btn btn-success" onclick="addMessage()">发布留言</button>
        </div>

        <!-- 统计信息 -->
        <div class="alert alert-info" id="statsInfo">
            <strong>📊 统计：</strong>
            <span id="stats"></span>
        </div>

        <!-- 留言列表 -->
        <div id="messageList"></div>
    </div>

    <script>
        // ========================================
        // 数据层（使用ES6+ class）
        // ========================================
        class MessageStore {
            constructor() {
                this.messages = this.loadFromLocalStorage();
            }

            // 加载数据（使用默认值）
            loadFromLocalStorage() {
                const data = localStorage.getItem('messages_v5');
                return data ? JSON.parse(data) : [];
            }

            // 保存数据（箭头函数）
            save = () => {
                localStorage.setItem('messages_v5', JSON.stringify(this.messages));
            }

            // 添加留言（对象简写）
            add({ name, content }) {
                const newMessage = {
                    id: Date.now(),
                    name,
                    content,
                    timestamp: new Date().toLocaleString('zh-CN')
                };
                this.messages = [...this.messages, newMessage];  // 展开运算符
                this.save();
                return newMessage;
            }

            // 删除留言（filter）
            delete(id) {
                this.messages = this.messages.filter(msg => msg.id !== id);
                this.save();
            }

            // 获取所有留言
            getAll() {
                return [...this.messages];  // 返回副本
            }

            // 按条件筛选（filter + includes）
            filter({ name = '', content = '' }) {
                return this.messages.filter(msg =>
                    msg.name.includes(name) && msg.content.includes(content)
                );
            }

            // 按时间排序（sort）
            sortByTime(ascending = false) {
                return [...this.messages].sort((a, b) =>
                    ascending ? a.id - b.id : b.id - a.id
                );
            }

            // 统计信息（reduce）
            getStats() {
                const total = this.messages.length;
                const authors = [...new Set(this.messages.map(msg => msg.name))];  // 去重
                const avgLength = this.messages.length > 0
                    ? this.messages.reduce((sum, msg) => sum + msg.content.length, 0) / total
                    : 0;

                return { total, authors: authors.length, avgLength: avgLength.toFixed(0) };
            }
        }

        // 创建全局store实例
        const store = new MessageStore();


        // ========================================
        // 视图层（使用模板字符串 + map）
        // ========================================

        // 渲染留言列表（使用map + 模板字符串）
        const renderMessages = (messages = store.getAll()) => {
            const listElement = document.getElementById('messageList');

            if (messages.length === 0) {
                listElement.innerHTML = `
                    <div class="alert alert-warning text-center">
                        暂无留言，快来发表第一条吧！
                    </div>
                `;
                return;
            }

            // 使用map生成HTML（函数式编程）
            const html = messages
                .map(({ id, name, content, timestamp }) => `
                    <div class="card message-card">
                        <div class="card-body">
                            <h5 class="card-title">${name}</h5>
                            <p class="card-text">${content}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="timestamp">🕐 ${timestamp}</small>
                                <button class="btn btn-danger btn-sm" onclick="deleteMessage(${id})">
                                    删除
                                </button>
                            </div>
                        </div>
                    </div>
                `)
                .join('');  // 数组转字符串

            listElement.innerHTML = html;
        };

        // 渲染统计信息（使用解构）
        const renderStats = () => {
            const { total, authors, avgLength } = store.getStats();
            document.getElementById('stats').innerHTML = `
                共 ${total} 条留言 | ${authors} 位作者 | 平均长度 ${avgLength} 字
            `;
        };

        // ========================================
        // 控制器层（事件处理函数）
        // ========================================

        // 添加留言（使用解构和箭头函数）
        const addMessage = () => {
            const nameInput = document.getElementById('nameInput');
            const contentInput = document.getElementById('contentInput');

            const name = nameInput.value.trim();
            const content = contentInput.value.trim();

            // 验证（使用模板字符串）
            if (!name) {
                alert('请输入姓名！');
                return;
            }

            if (!content) {
                alert('请输入留言内容！');
                return;
            }

            // 添加留言（对象简写）
            store.add({ name, content });

            // 清空表单
            nameInput.value = '';
            contentInput.value = '';

            // 重新渲染
            renderMessages();
            renderStats();

            alert('留言发布成功！');
        };

        // 删除留言（箭头函数）
        const deleteMessage = (id) => {
            if (!confirm('确定要删除这条留言吗？')) return;

            store.delete(id);
            renderMessages();
            renderStats();
        };


        // 应用筛选（使用解构和链式调用）
        const applyFilters = () => {
            const name = document.getElementById('searchName').value.trim();
            const content = document.getElementById('searchContent').value.trim();

            // 使用filter方法筛选
            const filtered = store.filter({ name, content });

            renderMessages(filtered);
        };

        // 重置筛选
        const resetFilters = () => {
            document.getElementById('searchName').value = '';
            document.getElementById('searchContent').value = '';
            renderMessages();
        };

        // 按时间排序
        const sortByTime = () => {
            const sorted = store.sortByTime();
            renderMessages(sorted);
        };

        // ========================================
        // 初始化（使用箭头函数）
        // ========================================
        const init = () => {
            renderMessages();
            renderStats();
            console.log('留言板 v5.0 初始化完成！使用了以下ES6+特性：');
            console.log('✅ class 类');
            console.log('✅ 箭头函数');
            console.log('✅ 解构赋值');
            console.log('✅ 展开运算符');
            console.log('✅ 模板字符串');
            console.log('✅ 对象简写');
            console.log('✅ 默认参数');
            console.log('✅ map/filter/reduce');
        };

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);

        // ========================================
        // 对比说明（打印到控制台）
        // ========================================
        console.log('='.repeat(60));
        console.log('留言板版本对比');
        console.log('='.repeat(60));
        console.log('v1.0: 内存存储 + 传统JS');
        console.log('v2.0: JSON持久化 + 传统JS');
        console.log('v3.0: RESTful API + 传统JS');
        console.log('v4.0: SQLite数据库 + 传统JS');
        console.log('v5.0: LocalStorage + 现代JS (ES6+)');
        console.log('='.repeat(60));
        console.log('v5.0 新特性：');
        console.log('- class MessageStore（面向对象）');
        console.log('- 箭头函数简化代码');
        console.log('- 解构赋值提取数据');
        console.log('- 展开运算符复制/合并');
        console.log('- 模板字符串拼接HTML');
        console.log('- map/filter/reduce处理数组');
        console.log('- 函数式编程风格');
        console.log('='.repeat(60));
    </script>
</body>
</html>
