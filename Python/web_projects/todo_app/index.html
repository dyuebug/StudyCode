<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Todo App - 现代待办事项</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 主容器 -->
    <div class="container my-5">
        <!-- 应用卡片 -->
        <div class="card shadow-lg">
            <!-- Header - 应用标题 -->
            <div class="card-header bg-primary text-white text-center py-4">
                <h1 class="mb-0">
                    <i class="bi bi-check-circle"></i>
                    Modern Todo App
                </h1>
                <p class="mb-0 mt-2 opacity-75">高效管理你的待办事项</p>
            </div>

            <!-- Card Body - 主要内容区 -->
            <div class="card-body p-4">
                <!-- Input Section - 输入区域 -->
                <div class="input-group mb-4">
                    <input
                        type="text"
                        id="taskInput"
                        class="form-control form-control-lg"
                        placeholder="添加新任务..."
                        aria-label="添加新任务"
                        autofocus
                    >
                    <button
                        id="addTaskBtn"
                        class="btn btn-primary btn-lg"
                        type="button"
                    >
                        <span class="btn-text">添加</span>
                        <span class="btn-icon">+</span>
                    </button>
                </div>

                <!-- Filter Section - 筛选区域 -->
                <div class="filter-section mb-3">
                    <div class="btn-group w-100" role="group" aria-label="任务筛选">
                        <button
                            type="button"
                            class="btn btn-outline-primary filter-btn active"
                            data-filter="all"
                        >
                            全部
                        </button>
                        <button
                            type="button"
                            class="btn btn-outline-primary filter-btn"
                            data-filter="active"
                        >
                            进行中
                        </button>
                        <button
                            type="button"
                            class="btn btn-outline-primary filter-btn"
                            data-filter="completed"
                        >
                            已完成
                        </button>
                    </div>
                </div>

                <!-- Stats Section - 统计区域 -->
                <div class="stats-section mb-3">
                    <div class="row text-center">
                        <div class="col-4">
                            <div class="stat-item">
                                <span class="stat-label">总计</span>
                                <span class="stat-value text-primary" id="totalCount">0</span>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="stat-item">
                                <span class="stat-label">已完成</span>
                                <span class="stat-value text-success" id="completedCount">0</span>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="stat-item">
                                <span class="stat-label">进行中</span>
                                <span class="stat-value text-warning" id="activeCount">0</span>
                            </div>
                        </div>
                    </div>
                    <div class="progress mt-2" style="height: 8px;">
                        <div
                            id="progressBar"
                            class="progress-bar bg-success"
                            role="progressbar"
                            style="width: 0%"
                            aria-valuenow="0"
                            aria-valuemin="0"
                            aria-valuemax="100"
                        ></div>
                    </div>
                </div>

                <!-- Task List - 任务列表 -->
                <div class="task-list-container">
                    <ul id="taskList" class="list-group">
                        <!-- 任务项将通过JavaScript动态生成 -->
                        <!-- 空状态提示 -->
                        <li class="list-group-item text-center empty-state">
                            <div class="py-5">
                                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-muted mb-3">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M12 6v6l4 2"></path>
                                </svg>
                                <p class="text-muted mb-0">暂无任务</p>
                                <p class="text-muted small">添加你的第一个待办事项吧！</p>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Footer - 页脚信息 -->
            <div class="card-footer text-center text-muted small">
                <p class="mb-0">💡 提示：点击任务标记完成，点击删除按钮移除任务</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JavaScript Bundle (包含Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 应用脚本 -->
    <script src="storage.js"></script>
    <script src="app.js"></script>
</body>
</html>
