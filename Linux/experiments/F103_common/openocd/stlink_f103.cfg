# OpenOCD 目标配置：ST-Link V2 + STM32F103C8T6
#
# 用法：
#   openocd -f experiments/F103_common/openocd/stlink_f103.cfg \
#           -c "program <固件>.elf verify reset exit"

# ST-Link 家族驱动；V2 及其兼容克隆均使用 hla_swd
source [find interface/stlink.cfg]
transport select hla_swd

source [find target/stm32f1x.cfg]

# 1 MHz 对杜邦线和克隆版探头较宽容；若报 "target not halted" 或校验失败，
# 先降到 480 再排查接线与供电
adapter speed 1000
